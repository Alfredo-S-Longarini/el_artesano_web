<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="100" fill="#F9F7F2"/>
  <!-- Cuerpo de la lupa -->
  <circle cx="88" cy="88" r="38" stroke="#5c4033" stroke-width="6" fill="none"/>
  <!-- Retícula interna -->
  <circle cx="88" cy="88" r="20" stroke="#5c4033" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <!-- Marcas de precisión (tipo reloj) -->
  <line x1="88" y1="50" x2="88" y2="58" stroke="#5c4033" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="118" x2="88" y2="126" stroke="#5c4033" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="88" x2="58" y2="88" stroke="#5c4033" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="88" x2="126" y2="88" stroke="#5c4033" stroke-width="3" stroke-linecap="round"/>
  <!-- Cruz central dorada -->
  <line x1="80" y1="88" x2="96" y2="88" stroke="#c8a96e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="80" x2="88" y2="96" stroke="#c8a96e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mango de la lupa -->
  <line x1="116" y1="116" x2="148" y2="148" stroke="#5c4033" stroke-width="10" stroke-linecap="round"/>
  <!-- Detalle del mango (anillo artesanal) -->
  <line x1="124" y1="120" x2="120" y2="124" stroke="#c8a96e" stroke-width="3" stroke-linecap="round"/>
  <line x1="132" y1="128" x2="128" y2="132" stroke="#c8a96e" stroke-width="3" stroke-linecap="round"/>
</svg>